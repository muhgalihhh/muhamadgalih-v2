          - generic [ref=e498]: Machine Learning
          - generic [ref=e503]:
            - heading "Gold Price Prediction with KNN and Linear Regression" [level=3] [ref=e504]
            - paragraph [ref=e505]: Projek ini merupakan studi kasus machine learning oleh Muhamad Galih yang bertujuan untuk memprediksi pergerakan harga emas (Gold Futures) menggunakan dataset historis dari Yahoo Finance periode 2015 hingga April 2025. Penelitian ini menerapkan dua pendekatan utama, yaitu klasifikasi menggunakan algoritma K-Nearest Neighbors (KNN) untuk menentukan arah harga (naik/turun) dengan akurasi terbaik sebesar 89,12%, serta regresi linear untuk memprediksi nilai numerik harga penutupan dengan performa $R^2$ mencapai 0,9958. Melalui proses feature engineering yang melibatkan indikator teknikal seperti Moving Averages (MA), Exponential Moving Averages (EMA), momentum, dan volatilitas, model ini berhasil memberikan prediksi harga emas untuk tanggal 24 April 2025 sebesar $3405.36 dengan keyakinan arah harga akan naik sebesar 100%.
            - generic: Python
