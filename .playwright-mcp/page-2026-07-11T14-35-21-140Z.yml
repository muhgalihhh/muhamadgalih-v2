            - heading "FoldIn.space - UI/UX Redesign & Design System" [level=3] [ref=e461]
            - paragraph [ref=e462]: Led the end-to-end redesign of FoldIn, a social network for local events, building a token-driven Figma design system (~92 tokens, 6 collections, 5 breakpoints) that unified a fragmented UI from 8 fonts into one cohesive identity. Designed a 25+ component library, a custom flat icon system, and 50+ responsive screens spanning onboarding, events, checkout, wallet, and settings/KYC. Conceived and designed the flagship Ghost Match feature, turning verified event attendance into a connection-discovery experience.
