            - heading "Bakery Shop - Bakery ERP System" [level=3] [ref=f12e63]
            - paragraph [ref=f12e64]: Bakery ERP System is a full-featured Enterprise Resource Planning application built to manage the end-to-end operations of a bakery business. Developed with Laravel 12, Filament 4, Tailwind CSS, and Alpine.js, it unifies procurement, production, inventory, sales, and accounting into a single admin platform. The system covers the complete supply chain, from purchase orders, vendor management, and goods receipts, through recipe-driven production using Bill of Materials (BOM) and manufacturing orders, to real-time inventory tracking via stock movements and adjustments. On the sales side, it includes an integrated Point of Sale (POS), sales order processing, and a customer loyalty engine featuring tiered memberships, a points ledger, and configurable discount rules. A built-in double-entry accounting module with a Chart of Accounts, journal entries, and vendor payments ensures every transaction is financially reconciled, while role-based access control (Filament Shield), PDF invoicing, and Excel import/export round out a production-ready, business-grade solution.
