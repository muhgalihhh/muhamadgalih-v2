            - paragraph [ref=f12e121]: Menjelaskan implementasi Algoritma Genetika untuk menemukan solusi optimal dalam pemenuhan Angka Kecukupan Gizi (AKG) berdasarkan dataset makanan tertentu. Model ini mengevaluasi berbagai kombinasi makanan untuk memenuhi kriteria nutrisi seperti kalori, karbohidrat, protein, lemak, vitamin C, dan kalsium dengan batasan total berat dan biaya maksimal. Melalui proses evolusi yang mencakup seleksi (seperti roulette wheel, tournament, atau rank), one-point crossover, dan insert mutation, algoritma ini mampu mencapai kondisi konvergensi untuk menghasilkan daftar bahan makanan dengan nilai fitness terbaik. Berdasarkan pengujian dengan konfigurasi berbeda, penggunaan metode Tournament Selection menunjukkan performa paling unggul dalam mencapai nilai fitness tertinggi dibandingkan metode lainnya.
